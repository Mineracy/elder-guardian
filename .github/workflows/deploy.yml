name: Deploy Elder Guardian to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        working-directory: ./app
        run: npm install
        
      - name: Build Project
        working-directory: ./app
        run: npm run build

      - name: Run D1 Migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'app'
          command: d1 migrations apply rowdy --remote
          wranglerVersion: 'latest'

      - name: Deploy to Cloudflare Workers
        working-directory: ./app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          EMAIL_FROM: Guardian <hello@elderguardian.vip>
          APP_BASE_URL: https://guardian-backend.rowdyhacks.workers.dev
          ENVIRONMENT: production
        run: |
          echo "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY --yes
          echo "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY --yes
          npx wrangler deploy \
            --var GEMINI_MODEL="$GEMINI_MODEL" \
            --var EMAIL_FROM="$EMAIL_FROM" \
            --var APP_BASE_URL="$APP_BASE_URL" \
            --var ENVIRONMENT="$ENVIRONMENT"
