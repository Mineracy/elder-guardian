<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elder Guardian</title>
    <link rel="icon" href="../icons/icon-32.png" />
    <link rel="stylesheet" href="hold.css" />
  </head>
  <body>
    <main>
      <div id="icon" class="icon"><img src="../icons/icon-256.png" alt="Elder Guardian" width="96" height="96" /></div>
      <h1 id="title">Awaiting verification</h1>
      <p id="subtitle">We paused this page to keep you safe. We've asked your trusted contact to take a look.</p>
      <p class="target" id="target"></p>
      <div id="spinner" class="spinner" aria-hidden="true"></div>
      <section id="education" class="card" hidden>
        <h2 id="education-title">While you wait</h2>
        <p id="education-text"></p>
      </section>
      <div class="actions">
        <button id="back" class="secondary">Go back to safety</button>
      </div>
    </main>
    <script type="module" src="hold.js"></script>
  </body>
</html>
