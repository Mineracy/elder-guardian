<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guardian</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <h2>🛡️ Guardian</h2>
      <p id="error" class="error" hidden></p>

      <!-- Signed out -->
      <form id="auth-form" hidden>
        <label>Email <input type="email" name="email" required autocomplete="username" /></label>
        <label>Password <input type="password" name="password" required minlength="8" autocomplete="current-password" /></label>
        <div id="role-row" hidden>
          <label>I am the
            <select name="role">
              <option value="protected">person being protected</option>
              <option value="trusted">trusted contact</option>
            </select>
          </label>
        </div>
        <button type="submit" id="auth-submit">Sign in</button>
        <button type="button" id="auth-toggle" class="link">New here? Create an account</button>
      </form>

      <!-- Signed in -->
      <div id="account" hidden>
        <p class="muted">Signed in as <strong id="who"></strong></p>

        <section id="protected-only">
          <h3>Trusted contact</h3>
          <p id="contact-current" hidden></p>
          <form id="contact-form" hidden>
            <label>Their email <input type="email" name="email" placeholder="name@gmail.com" required /></label>
            <button type="submit">Connect trusted person</button>
          </form>
          <p class="muted" id="contact-note" hidden>For your safety, only your trusted contact can change this list.</p>

          <h3>Approved sites</h3>
          <ul id="whitelist"></ul>
        </section>

        <section id="trusted-only" hidden>
          <p>As a trusted contact you'll get an email with a secure link whenever someone you look after needs approval. There's nothing else to set up here.</p>
        </section>

        <button id="signout" class="secondary">Sign out</button>
      </div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
